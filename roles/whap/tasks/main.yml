- ansible.builtin.import_role:
    name: compose_hull
    tasks_from: prepare
  vars:
    service_defaults:
      directory: "{{ docker_dir }}/whap"
      subdirs: ["postgres", "ansible_project", "ssh_keys", "ansible_runner_data", "influxdb_data"]
      name: "whap"
      port: 80
      traefik: true
      external: true
      watchtower: false
      autoheal: true
      container_file_owner: "root"
      uid: 3000
      gid: 3000
      extra_role_dirs: []
      app_subdir: "WhaP"
      # Test-rig fixtures for the end-to-end tests (whap/e2e): a disposable
      # LDAP directory and a small dataset. Never enable in production.
      e2e:
        enabled: false
        dataset: "e2e-dataset"
      db:
        version: "17-alpine"
      redis:
        version: "6.2"
      influxdb:
        version: "2.7"
        org: "whap_org"
        admin_username: "influx_admin"
        #admin_password: "sectretPASSWORD"
        #token: "sectretTOKEN"
        bucket: "metrics"
      separate_traefik_network:
        use: true
        name: "traefik_default"

#- name: Get the git repository
#  ansible.builtin.git:
#    repo: 'git@github.com:pinae/WhaP.git'
#    dest: '{{ service_cfg.directory }}/'
#    force: true

# The roles come from the WhaP next to the playbook; the images are built from
# the checkout on the server ({{ directory }}/{{ app_subdir }}). When the two
# are at different commits, a deploy mixes versions -- the compose file from
# one, the code from the other -- and can leave old containers running. Stop
# before that when both are git checkouts. whap_allow_version_mismatch=true
# overrides it.
- name: Find the WhaP commit the roles come from
  ansible.builtin.command:
    argv: [git, -C, "{{ role_path }}", rev-parse, HEAD]
  delegate_to: localhost
  become: false
  run_once: true
  register: whap_roles_commit
  changed_when: false
  failed_when: false
  tags: [ always ]

- name: Find the WhaP commit the images are built from
  ansible.builtin.command:
    # safe.directory: the play runs as root, the checkout belongs to a user.
    argv: [git, -c, "safe.directory=*", -C, "{{ service_cfg.directory }}/{{ service_cfg.app_subdir }}",
           rev-parse, HEAD]
  register: whap_code_commit
  changed_when: false
  failed_when: false
  tags: [ always ]

- name: The roles and the code on the server must be the same WhaP version
  ansible.builtin.assert:
    that: whap_roles_commit.stdout == whap_code_commit.stdout
    fail_msg: >-
      The roles are WhaP {{ whap_roles_commit.stdout[:7] }} ({{ role_path | dirname | dirname }}), but
      {{ inventory_hostname }} would build its images from WhaP {{ whap_code_commit.stdout[:7] }}
      ({{ service_cfg.directory }}/{{ service_cfg.app_subdir }}). Check out the same commit in both,
      e.g. git pull in each, or set whap_allow_version_mismatch=true.
    quiet: true
  when:
    - whap_roles_commit.rc == 0
    - whap_code_commit.rc == 0
    - not (whap_allow_version_mismatch | default(false) | bool)
  tags: [ always ]

- name: "Copy {{ service_cfg.name }} nginx.conf"
  template:
    src: nginx.conf.j2
    dest: '{{ service_cfg.directory }}/nginx.conf'
    owner: '{{ admin.name }}'
    group: 'docker'

- name: "Copy {{ service_cfg.name }} .env.prod"
  template:
    src: env.prod.j2
    dest: '{{ service_cfg.directory }}/.env.prod'
    owner: '{{ admin.name }}'
    group: 'docker'

# The images are built here, on every deploy, under the names the compose file
# gives them (image: + build:), with the layer cache and a fresh base image:
# the image ID changes exactly when the code, the lock files or the base image
# do. Compose would not notice a rebuilt image under an unchanged name, so the
# ID is also written into each service's labels (below and in the compose
# file); a new image changes the service, and compose recreates it.
- name: Build the image for the backend, worker and migrate containers
  community.docker.docker_image:
    name: '{{ service_cfg.name }}-backend'
    build:
      path: '{{ service_cfg.directory }}/{{ service_cfg.app_subdir }}/whap/backend/'
      args:
        USER_ID: "{{ service_cfg.uid }}"
        GROUP_ID: "{{ service_cfg.gid }}"
      pull: true
    source: build
    force_source: true
    push: false

- name: Build the image for the frontend container
  community.docker.docker_image:
    name: '{{ service_cfg.name }}-nginx'
    build:
      path: '{{ service_cfg.directory }}/{{ service_cfg.app_subdir }}/whap/frontend/'
      pull: true
      rm: true
    source: build
    force_source: true
    push: false

- name: Build the image for the e2e LDAP directory
  when: service_cfg.e2e.enabled
  community.docker.docker_image:
    name: '{{ service_cfg.name }}-e2e-ldap'
    build:
      path: '{{ service_cfg.directory }}/{{ service_cfg.app_subdir }}/whap/e2e/ldap/'
      pull: true
    source: build
    force_source: true
    push: false

# Tagged always, so a run limited by tags (e.g. --tags restarted) still renders
# the compose file with the IDs of the images that exist.
- name: Look up the IDs of the WhaP images
  community.docker.docker_image_info:
    name: '{{ service_cfg.name }}-{{ item }}'
  loop: [backend, nginx, e2e-ldap]
  register: whap_image_info
  tags: [ always ]

- name: Remember the image IDs for the compose file
  ansible.builtin.set_fact:
    whap_image_ids: "{{ whap_image_ids | default({}) | combine({item.item: ((item.images | first | default({})).Id | default(''))}) }}"
  loop: "{{ whap_image_info.results }}"
  loop_control:
    label: "{{ item.item }}"
  tags: [ always ]

# Every WhaP container mounts DATASETS read-only -- datasets are curated by an
# admin -- so the e2e dataset is created here, on the host, not by the app.
- name: "Create the e2e dataset {{ service_cfg.e2e.dataset }}"
  when: service_cfg.e2e.enabled
  become: true
  block:
    - name: "Create the e2e dataset directory"
      ansible.builtin.file:
        path: "{{ service_cfg.projects_dir }}/DATASETS/{{ service_cfg.e2e.dataset }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # The tests read this back through the container mount to prove the
    # dataset is really there, not just an empty mount point.
    - name: "Write the e2e dataset marker"
      ansible.builtin.copy:
        content: "whap-e2e-dataset\n"
        dest: "{{ service_cfg.projects_dir }}/DATASETS/{{ service_cfg.e2e.dataset }}/e2e-marker.txt"
        owner: root
        group: root
        mode: "0644"

- ansible.builtin.import_role:
    name: compose_hull
    tasks_from: deploy_docker