- name: "Ensure {{ docker_dir }} exists"
  become: true
  file:
    path: "{{ docker_dir }}"
    state: directory
    owner: "{{ service_cfg.owner }}"
    group: "{{ service_cfg.group }}"
    mode: "775"

- name: "Ensure {{ docker_dir }}/{{ service_cfg.image_name }}-{{ service_cfg.user }}-{{ service_cfg.project_name }} exists"
  become: true
  file:
    path: "{{ docker_dir }}/{{ service_cfg.image_name }}-{{ service_cfg.user }}-{{ service_cfg.project_name }}"
    state: directory
    owner: "{{ service_cfg.owner }}"
    group: "{{ service_cfg.group }}"
    mode: "775"

- name: "Ensure {{ docker_dir }}/{{ service_cfg.image_name }}-{{ service_cfg.user }}-{{ service_cfg.project_name }}/build exists"
  become: true
  file:
    path: "{{ docker_dir }}/{{ service_cfg.image_name }}-{{ service_cfg.user }}-{{ service_cfg.project_name }}/build"
    state: directory
    owner: "{{ service_cfg.owner }}"
    group: "{{ service_cfg.group }}"
    mode: "775"