# The test rig the end-to-end tests run against. Copy to rig.toml (gitignored)
# and fill in; or point WHAP_E2E_RIG at another file.

[whap]
# The frontend, as a browser on the machine running the tests reaches it.
url = "https://whap-test.example.com"

# The e2e LDAP directory's people (whap/e2e/ldap). Passwords are the
# e2e.alice_password / e2e.bob_password from the storage server's host_vars.
[users.alice]
uid = "e2e-alice"
password = "..."

[users.bob]
uid = "e2e-bob"
password = "..."

[storage]
# How to run a command on the storage server: [] when the tests run there,
# which is also where they must run from to reach the containers (README.md).
shell = []
# e.g. shell = ["ssh", "victor"]

# The backend's flask CLI, run after `shell`.
backend_cli = ["docker", "exec", "-i", "whap-backend", "flask"]

# The seed spec (see seed.example.yml), relative to this file. Reset and seed
# run once at the start of every session.
seed_spec = "seed.yml"

# whap.projects_dir from the storage server's host_vars. Project directories
# are created at <projects_dir>/<owner>/<project>.
projects_dir = "/data/projects"

[compute]
# Optional. How to run a command line on the compute server, so a failed
# container test can attach the container's `docker logs`. The command line is
# passed as the last argument, as ssh takes it; the user needs docker access.
# shell = ["ssh", "tycho"]

[container]
# All optional; defaults shown. The role the single-container tests start.
# image = "worker_local_ubuntu2510_ssh"
# The compute server to choose. Leave unset when the test users have only one,
# which the form then pre-selects.
# server = "tycho"
# gpu = "0"
# A substring nvidia-smi must report for that GPU; empty accepts any GPU.
gpu_name = "2070"
# Seconds. The first container of a role on a fresh rig builds or pulls its
# image, which can take a long time.
# start_timeout = 1800
# delete_timeout = 600

[torch]
# Where pip gets torch inside the container. Empty means PyPI; pick a CUDA
# build the compute server's driver supports, e.g.
# index_url = "https://download.pytorch.org/whl/cu126"
# The first run downloads several GB into a virtualenv in the project's home
# directory on the compute server, which later runs reuse.
# install_timeout = 1800

[browser]
# Optional: a Chromium to use instead of the one `playwright install` fetches.
# executable = "/usr/bin/chromium"
# Optional: accept the rig's TLS certificate even if the browser doesn't trust it.
# ignore_https_errors = true
