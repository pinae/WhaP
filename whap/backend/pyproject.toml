[project]
name = "whap-backend"
version = "0.1.0"
description = "Fischer's Whale Pond (WhaP) backend"
requires-python = ">=3.13"

# Single source of truth for runtime dependencies (replaces requirements.txt).
dependencies = [
    "Flask>=3.1.0",
    "Flask-SQLAlchemy>=3.1.0",
    "Flask-Migrate>=4.1.0",
    "Flask-Login>=0.6.3",
    "flask-cors>=5.0.1",
    "Flask-SocketIO>=5.5.0",
    "simple-websocket>=1.1.0",
    "python-ldap>=3.4.0",
    "ansible>=11.9.0",
    "ansible-core>=2.18.8",
    "ansible-runner>=2.3.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "gunicorn>=23.0.0",
    "requests>=2.30.0",
    "Werkzeug>=3.1.3",
    "PyYAML>=6.0",
    "redis>=6.4.0",
    "influxdb-client>=1.40.0",
]

# Note: eventlet is intentionally NOT a dependency anymore (we run Socket.IO in
# threading mode). If it lingers in your venv, drop it: `uv remove eventlet`
# (or recreate the environment with `uv sync`).

# Development / test dependencies (replaces requirements-dev.txt and the Pipfile
# dev group). Installed by default with `uv sync`; omit with `uv sync --no-dev`.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

# This is an application, not a distributable library: uv manages the
# environment but doesn't build/install the project itself.
[tool.uv]
package = false

[tool.pytest.ini_options]
# Run from this directory (whap/backend): `uv run pytest`.
# pythonpath = ["."] puts the backend root on sys.path so `import app` resolves.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"
filterwarnings = [
    # Silence eventlet's driver probe if it is still present in a stale venv.
    "ignore::DeprecationWarning:engineio.async_drivers.eventlet",
    # Fail the suite on the SQLAlchemy 2.0 legacy Query.get()/get_or_404() API so
    # a reintroduced Model.query.get(...) is caught here instead of warned about.
    "error::sqlalchemy.exc.LegacyAPIWarning",
]

# Coverage config for `uv run pytest --cov` (pytest-cov is in the dev group).
[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "tests/*",
    "app/docs/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Don't count defensive/boilerplate lines against coverage.
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]